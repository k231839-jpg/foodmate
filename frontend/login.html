<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create your Food Mate account to start ordering delicious food.">
  <title>Food Mate — Sign In / Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-page">
    <!-- Left: Image Side -->
    <div class="auth-image-side">
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=900&h=1200&fit=crop" alt="Delicious food spread">
      <div class="overlay"></div>
      <div style="position:absolute; bottom:3rem; left:3rem; right:3rem; z-index:2;">
        <h2 style="font-weight:800; font-size:2rem; margin-bottom:0.5rem;">Discover Amazing Food</h2>
        <p style="color:rgba(255,255,255,0.8); font-size:1rem;">Join Food Mate and enjoy Melbourne's best restaurants delivered to your door with zero service fees.</p>
      </div>
    </div>

    <!-- Right: Form Side -->
    <div class="auth-form-side">
      <div class="auth-form-container">
        <!-- Brand -->
        <div class="brand-logo">
          <a href="index.html" style="color:var(--text-primary); text-decoration:none;">
            <i class="bi bi-egg-fried" style="color:var(--accent)"></i> Food <span>Mate</span>
          </a>
        </div>

        <!-- Sign In Card -->
        <div class="auth-card" id="loginCard">
          <h2>Welcome Back</h2>
          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <div class="input-group-dark">
                <div class="input-group">
                  <span class="input-group-text" style="background:var(--bg-secondary); border:1px solid var(--border-color); border-right:none; color:var(--text-muted);">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input type="email" class="form-control form-control-dark" placeholder="Email address" id="loginEmail" required>
                </div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label-dark">Password</label>
              <div class="password-toggle">
                <input type="password" class="form-control form-control-dark" placeholder="Enter your password" id="loginPassword" required>
                <button type="button" class="toggle-btn"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small" for="rememberMe" style="color:var(--text-secondary)">Remember Me</label>
              </div>
              <a href="#" style="font-size:0.85rem">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-accent w-100 py-2 mb-3">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>

          <div class="divider-text">or</div>

          <div class="social-login">
            <button class="btn"><i class="bi bi-google" style="color:#EA4335"></i> Google</button>
            <button class="btn"><i class="bi bi-facebook" style="color:#1877F2"></i> Facebook</button>
          </div>

          <p class="text-center mt-3" style="font-size:0.88rem; color:var(--text-secondary)">
            Don't have an account? <a href="#" onclick="toggleAuth(event)">Register</a>
          </p>
        </div>

        <!-- Auth Toggle -->
        <div class="auth-toggle">
          <span id="toggleLabelLogin" style="color:var(--accent); font-weight:700;">Sign In</span>
          <div class="toggle-switch" id="authToggle" onclick="toggleAuth(event)">
            <div class="toggle-knob"></div>
          </div>
          <span id="toggleLabelRegister" style="color:var(--text-secondary);">Register</span>
        </div>

        <!-- Register Card (hidden initially) -->
        <div class="auth-card mt-3" id="registerCard" style="display:none;">
          <h2>Create Account</h2>
          <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3">
              <input type="text" class="form-control form-control-dark" placeholder="Full Name" id="regName" required>
            </div>
            <div class="mb-3">
              <input type="email" class="form-control form-control-dark" placeholder="Email address" id="regEmail" required>
            </div>
            <div class="mb-3">
              <input type="tel" class="form-control form-control-dark" placeholder="Phone number" id="regPhone" required>
            </div>
            <div class="mb-3">
              <div class="password-toggle">
                <input type="password" class="form-control form-control-dark" placeholder="Create a password" id="regPassword" required>
                <button type="button" class="toggle-btn"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label-dark">I am a:</label>
              <div class="role-selector">
                <div class="role-option">
                  <input type="radio" name="userRole" id="roleCustomer" value="customer" checked>
                  <label for="roleCustomer"><i class="bi bi-person me-1"></i>Customer</label>
                </div>
                <div class="role-option">
                  <input type="radio" name="userRole" id="roleRestaurant" value="restaurant">
                  <label for="roleRestaurant"><i class="bi bi-shop me-1"></i>Restaurant</label>
                </div>
                <div class="role-option">
                  <input type="radio" name="userRole" id="roleDelivery" value="delivery">
                  <label for="roleDelivery"><i class="bi bi-bicycle me-1"></i>Delivery</label>
                </div>
              </div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="agreeTerms" required>
              <label class="form-check-label small" for="agreeTerms" style="color:var(--text-secondary)">
                I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>
              </label>
            </div>
            <button type="submit" class="btn btn-accent w-100 py-2">
              <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    let isRegisterMode = false;

    function toggleAuth(e) {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      const loginCard = document.getElementById('loginCard');
      const registerCard = document.getElementById('registerCard');
      const toggle = document.getElementById('authToggle');
      const labelLogin = document.getElementById('toggleLabelLogin');
      const labelRegister = document.getElementById('toggleLabelRegister');

      if (isRegisterMode) {
        loginCard.style.display = 'none';
        registerCard.style.display = 'block';
        registerCard.style.animation = 'fadeInUp 0.4s ease forwards';
        toggle.classList.add('active');
        labelLogin.style.color = 'var(--text-secondary)';
        labelLogin.style.fontWeight = '500';
        labelRegister.style.color = 'var(--accent)';
        labelRegister.style.fontWeight = '700';
      } else {
        loginCard.style.display = 'block';
        registerCard.style.display = 'none';
        loginCard.style.animation = 'fadeInUp 0.4s ease forwards';
        toggle.classList.remove('active');
        labelLogin.style.color = 'var(--accent)';
        labelLogin.style.fontWeight = '700';
        labelRegister.style.color = 'var(--text-secondary)';
        labelRegister.style.fontWeight = '500';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const form = document.getElementById('loginForm');
      if (validateForm(form)) {
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const form = document.getElementById('registerForm');
      if (validateForm(form)) {
        const role = document.querySelector('input[name="userRole"]:checked').value;
        showToast(`Account created successfully as ${role}!`, 'success');
        setTimeout(() => {
          if (role === 'restaurant') window.location.href = 'restaurant-dashboard.html';
          else if (role === 'delivery') window.location.href = 'delivery-dashboard.html';
          else window.location.href = 'dashboard.html';
        }, 1500);
      }
    }
  </script>
</body>
</html>
