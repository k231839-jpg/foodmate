<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and search hundreds of restaurants on Food Mate. Filter by cuisine, rating, and more.">
  <title>Food Mate — Browse Restaurants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-foodmate fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <i class="bi bi-egg-fried brand-icon"></i> Food Mate
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="restaurant-detail.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="track-order.html">Track Order</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">My Account</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <div class="nav-search d-none d-md-block">
            <i class="bi bi-search search-icon"></i>
            <input type="text" placeholder="Search restaurants..." id="navSearch" oninput="searchRestaurants(this.value)">
          </div>
          <a href="login.html" class="btn btn-signin">Sign In</a>
          <a href="checkout.html" class="btn btn-icon position-relative">
            <i class="bi bi-cart3"></i>
            <span class="cart-count" style="position:absolute; top:-4px; right:-4px; display:none;">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div style="padding-top: 90px;"></div>

  <div class="container">
    <!-- Page Header -->
    <div class="mb-4">
      <h1 class="section-title">Restaurants Near You</h1>
      <p style="color:var(--text-secondary)">Discover the best food Melbourne has to offer</p>
    </div>

    <!-- Cuisine Filter Pills -->
    <div class="filter-pills" id="cuisineFilters">
      <button class="filter-pill active" data-filter="all">🍽️ All</button>
      <button class="filter-pill" data-filter="american">🍔 American</button>
      <button class="filter-pill" data-filter="italian">🍕 Italian</button>
      <button class="filter-pill" data-filter="japanese">🍣 Japanese</button>
      <button class="filter-pill" data-filter="indian">🍛 Indian</button>
      <button class="filter-pill" data-filter="mexican">🌮 Mexican</button>
    </div>

    <div class="row">
      <!-- Sidebar Filters -->
      <div class="col-lg-3 mb-4">
        <div class="card-dark">
          <h6 class="fw-bold mb-3"><i class="bi bi-funnel me-2" style="color:var(--accent)"></i>Filters</h6>

          <!-- Sort -->
          <div class="mb-3">
            <label class="form-label-dark">Sort By</label>
            <select class="form-select form-control-dark" id="sortSelect" onchange="sortRestaurants(this.value)">
              <option value="rating">Top Rated</option>
              <option value="deliveryTime">Fastest Delivery</option>
              <option value="priceLow">Price: Low to High</option>
              <option value="priceHigh">Price: High to Low</option>
            </select>
          </div>

          <!-- Rating -->
          <div class="mb-3">
            <label class="form-label-dark">Minimum Rating</label>
            <div class="d-flex flex-column gap-2">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ratingFilter" id="ratingAll" value="0" checked onchange="applyFilters()">
                <label class="form-check-label small" for="ratingAll" style="color:var(--text-secondary)">All Ratings</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ratingFilter" id="rating4" value="4" onchange="applyFilters()">
                <label class="form-check-label small" for="rating4" style="color:var(--text-secondary)"><i class="bi bi-star-fill" style="color:var(--warning)"></i> 4.0+</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ratingFilter" id="rating45" value="4.5" onchange="applyFilters()">
                <label class="form-check-label small" for="rating45" style="color:var(--text-secondary)"><i class="bi bi-star-fill" style="color:var(--warning)"></i> 4.5+</label>
              </div>
            </div>
          </div>

          <!-- Delivery Fee -->
          <div class="mb-3">
            <label class="form-label-dark">Max Delivery Fee</label>
            <input type="range" class="form-range" id="deliveryFeeRange" min="0" max="10" step="0.5" value="10" oninput="document.getElementById('feeLabel').textContent = '$' + this.value; applyFilters();">
            <div class="d-flex justify-content-between">
              <small style="color:var(--text-muted)">Free</small>
              <small style="color:var(--accent)" id="feeLabel">$10.00</small>
            </div>
          </div>

          <!-- Dietary -->
          <div class="mb-0">
            <label class="form-label-dark">Dietary Options</label>
            <div class="d-flex flex-column gap-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filterVegan">
                <label class="form-check-label small" for="filterVegan" style="color:var(--text-secondary)">🥬 Vegan</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filterGF">
                <label class="form-check-label small" for="filterGF" style="color:var(--text-secondary)">🌾 Gluten-Free</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filterHalal">
                <label class="form-check-label small" for="filterHalal" style="color:var(--text-secondary)">🕌 Halal</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Restaurant Grid -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span style="color:var(--text-secondary); font-size:0.9rem;" id="resultCount">Showing 6 restaurants</span>
        </div>
        <div class="row g-4" id="restaurantGrid">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Cart -->
  <div class="cart-floating">
    <a href="checkout.html">
      <button class="cart-btn">
        <i class="bi bi-cart3"></i>
        <span class="cart-count" style="display:none;">0</span>
      </button>
    </a>
  </div>

  <!-- Footer -->
  <footer class="footer mt-5">
    <div class="container">
      <div class="footer-bottom" style="border-top:none; padding-top:0; margin-top:0;">
        <p class="mb-0">&copy; 2026 Food Mate. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentCuisine = 'all';

    function renderRestaurants(restaurants) {
      const grid = document.getElementById('restaurantGrid');
      grid.innerHTML = '';
      document.getElementById('resultCount').textContent = `Showing ${restaurants.length} restaurant${restaurants.length !== 1 ? 's' : ''}`;

      restaurants.forEach((r, i) => {
        grid.innerHTML += `
          <div class="col-md-6 col-xl-4" data-cuisine="${r.cuisine}" style="animation: fadeInUp 0.4s ease ${i*0.1}s forwards; opacity:0">
            <a href="restaurant-detail.html?id=${r.id}" class="text-decoration-none">
              <div class="restaurant-card">
                <div class="card-img-wrapper">
                  <img src="${r.image}" alt="${r.name}" loading="lazy">
                  <button class="fav-btn" title="Add to favorites"><i class="bi bi-heart"></i></button>
                  <span class="delivery-badge"><i class="bi bi-clock me-1"></i>${r.deliveryTime}</span>
                </div>
                <div class="card-body">
                  <h6 class="restaurant-name">${r.name}</h6>
                  <div class="restaurant-meta">
                    <span class="rating"><i class="bi bi-star-fill"></i> ${r.rating}</span>
                    <span class="cuisine-tag">${r.cuisine}</span>
                    <span>$${r.deliveryFee.toFixed(2)} delivery</span>
                  </div>
                  <p class="mt-2 mb-0" style="font-size:0.8rem; color:var(--text-muted)">
                    <i class="bi bi-geo-alt me-1"></i>${r.address}
                  </p>
                </div>
              </div>
            </a>
          </div>`;
      });
      initFavorites();
    }

    function searchRestaurants(query) {
      const q = query.toLowerCase();
      let filtered = RESTAURANTS.filter(r =>
        r.name.toLowerCase().includes(q) ||
        r.cuisine.toLowerCase().includes(q) ||
        r.menu.some(m => m.name.toLowerCase().includes(q))
      );
      renderRestaurants(filtered);
    }

    function sortRestaurants(sortBy) {
      let sorted = [...RESTAURANTS];
      if (sortBy === 'rating') sorted.sort((a,b) => b.rating - a.rating);
      else if (sortBy === 'deliveryTime') sorted.sort((a,b) => parseInt(a.deliveryTime) - parseInt(b.deliveryTime));
      else if (sortBy === 'priceLow') sorted.sort((a,b) => a.deliveryFee - b.deliveryFee);
      else if (sortBy === 'priceHigh') sorted.sort((a,b) => b.deliveryFee - a.deliveryFee);
      renderRestaurants(sorted);
    }

    function applyFilters() {
      const minRating = parseFloat(document.querySelector('input[name="ratingFilter"]:checked').value);
      const maxFee = parseFloat(document.getElementById('deliveryFeeRange').value);

      let filtered = RESTAURANTS.filter(r => {
        if (r.rating < minRating) return false;
        if (r.deliveryFee > maxFee) return false;
        if (currentCuisine !== 'all' && r.cuisine.toLowerCase() !== currentCuisine) return false;
        return true;
      });
      renderRestaurants(filtered);
    }

    // Cuisine filter pills
    document.querySelectorAll('#cuisineFilters .filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('#cuisineFilters .filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentCuisine = pill.dataset.filter;
        applyFilters();
      });
    });

    // Initial render
    document.addEventListener('DOMContentLoaded', () => renderRestaurants(RESTAURANTS));
  </script>
</body>
</html>
